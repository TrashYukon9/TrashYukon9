<svg
  width="500"
  height="190"
  viewBox="0 0 500 190"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Fundo do card -->
  <rect
    x="1"
    y="1"
    width="498"
    height="188"
    rx="14"
    fill="#0D1117"
    stroke="#299452"
    stroke-width="1.5"
  />

  <!-- Identificação -->
  <text
    x="28"
    y="42"
    fill="#299452"
    font-family="monospace"
    font-size="14"
  >
    PROJECT_01
  </text>

  <!-- Nome -->
  <text
    x="28"
    y="78"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="24"
    font-weight="bold"
  >
    TODO LIST
  </text>

  <!-- Descrição -->
  <text
    x="28"
    y="108"
    fill="#8B949E"
    font-family="monospace"
    font-size="13"
  >
    Aplicação para gerenciamento de tarefas
  </text>

  <text
    x="28"
    y="130"
    fill="#8B949E"
    font-family="monospace"
    font-size="13"
  >
    com foco em organização e produtividade.
  </text>

  <!-- Tecnologias -->
  <text
    x="28"
    y="163"
    fill="#299452"
    font-family="monospace"
    font-size="13"
  >
    React · JavaScript · CSS · Vite
  </text>

  <!-- Indicador -->
  <circle
    cx="462"
    cy="34"
    r="5"
    fill="#299452"
  />

</svg>

