<svg
  width="1000"
  height="190"
  viewBox="0 0 1000 190"
  xmlns="http://www.w3.org/2000/svg"
>

  <style>
    .fade-in {
      opacity: 0;
      animation: fadeIn 1.2s ease forwards;
    }

    .fade-in-delay {
      opacity: 0;
      animation: fadeIn 1.2s ease 0.5s forwards;
    }

    .fade-in-delay-2 {
      opacity: 0;
      animation: fadeIn 1.2s ease 1s forwards;
    }

    .cursor {
      animation: blink 1s steps(1) infinite;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }

      51%, 100% {
        opacity: 0;
      }
    }
  </style>

  <!-- Background -->

  <rect
    x="1"
    y="1"
    width="998"
    height="188"
    rx="12"
    fill="#0D1117"
    stroke="#299452"
    stroke-width="2"
  />

  <!-- Terminal controls -->

  <circle cx="30" cy="25" r="5" fill="#299452" opacity="0.35"/>
  <circle cx="50" cy="25" r="5" fill="#299452" opacity="0.65"/>
  <circle cx="70" cy="25" r="5" fill="#299452"/>

  <!-- Terminal title -->

  <text
    x="965"
    y="30"
    text-anchor="end"
    fill="#8B949E"
    font-family="monospace"
    font-size="14"
  >
    winicius@github
  </text>

  <!-- Name -->

  <text
    class="fade-in"
    x="500"
    y="88"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="monospace"
    font-size="34"
    font-weight="bold"
    letter-spacing="3"
  >
    WINICIUS DANIEL
  </text>

  <!-- Role -->

  <text
    class="fade-in-delay"
    x="500"
    y="120"
    text-anchor="middle"
    fill="#299452"
    font-family="monospace"
    font-size="17"
    letter-spacing="4"
  >
    SOFTWARE DEVELOPER
  </text>

  <!-- Command -->

  <g class="fade-in-delay-2">

    <text
      x="488"
      y="157"
      text-anchor="middle"
      fill="#8B949E"
      font-family="monospace"
      font-size="15"
    >
      &gt; building things with code
    </text>

    <rect
      class="cursor"
      x="610"
      y="144"
      width="8"
      height="17"
      rx="1"
      fill="#299452"
    />

  </g>

</svg>
