<svg
  width="1000"
  height="30"
  viewBox="0 0 1000 30"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <linearGradient id="leftLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#299452" stop-opacity="0"/>
      <stop offset="100%" stop-color="#299452" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="rightLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#299452" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#299452" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- Linha esquerda -->
  <rect
    x="50"
    y="14"
    width="435"
    height="2"
    rx="1"
    fill="url(#leftLine)"
  />

  <!-- Ponto central -->
  <circle
    cx="500"
    cy="15"
    r="4"
    fill="#299452"
  />

  <!-- Linha direita -->
  <rect
    x="515"
    y="14"
    width="435"
    height="2"
    rx="1"
    fill="url(#rightLine)"
  />

</svg>
